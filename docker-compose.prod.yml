
services:
  # Base de Datos PostgreSQL — red interna, sin puerto expuesto al host
  postgres:
    image: postgres:16-alpine
    container_name: pathseek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema_tablas.sql:/docker-entrypoint-initdb.d/01_schema_tablas.sql:ro
      - ./database/02_triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql:ro
      - ./database/03_stored_procedures.sql:/docker-entrypoint-initdb.d/03_stored_procedures.sql:ro
      - ./database/04_seed_data.sql:/docker-entrypoint-initdb.d/04_seed_data.sql:ro
      - ./database/05_incremental_reoptimization.sql:/docker-entrypoint-initdb.d/05_incremental_reoptimization.sql:ro
      - ./database/06_user_administration.sql:/docker-entrypoint-initdb.d/06_user_administration.sql:ro
      - ./database/07_driver_dni_link.sql:/docker-entrypoint-initdb.d/07_driver_dni_link.sql:ro
      - ./database/08_carbon_offset.sql:/docker-entrypoint-initdb.d/08_carbon_offset.sql:ro
      - ./database/09_client_preferences.sql:/docker-entrypoint-initdb.d/09_client_preferences.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Solo visible dentro de la red interna Docker
    expose:
      - "5432"
    networks:
      - pathseek-internal

  # Backend Spring Boot Java 17 — red interna, sin puerto expuesto al host
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pathseek-backend:latest
    container_name: pathseek-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION_MINUTES=${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      - JWT_REFRESH_EXPIRATION_DAYS=${JWT_REFRESH_EXPIRATION_DAYS:-7}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - REOPTIMIZATION_BUDGET_MS=${REOPTIMIZATION_BUDGET_MS:-25000}
      - ROUTING_ENABLED=${ROUTING_ENABLED:-true}
      - ROUTING_BASE_URL=${ROUTING_BASE_URL:-https://router.project-osrm.org}
      - APP_BOOTSTRAP_USER_ENABLED=${APP_BOOTSTRAP_USER_ENABLED:-false}
      - APP_BOOTSTRAP_USER_NAME=${APP_BOOTSTRAP_USER_NAME:-}
      - APP_BOOTSTRAP_USER_EMAIL=${APP_BOOTSTRAP_USER_EMAIL:-}
      - APP_BOOTSTRAP_USER_PASSWORD=${APP_BOOTSTRAP_USER_PASSWORD:-}
      - APP_BOOTSTRAP_USER_ROLE=${APP_BOOTSTRAP_USER_ROLE:-ADMIN}
    # Solo visible dentro de la red interna Docker
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/health || wget -q -O /dev/null http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - pathseek-internal

  # Frontend Flutter Web (Nginx) — único punto de entrada al exterior
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        APP_ENV: prod
        API_BASE_URL: ${API_BASE_URL:-https://169.58.74.99}
    image: pathseek-frontend:latest
    container_name: pathseek-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"     # Redirección HTTP -> HTTPS
      - "443:443"   # HTTPS SSL Cifrado
    volumes:
      - ./ssl:/etc/nginx/certs:ro
    networks:
      - pathseek-internal

volumes:
  postgres_data:
    name: pathseek-postgres-data

networks:
  pathseek-internal:
    name: pathseek-network
    driver: bridge
