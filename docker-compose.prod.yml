
services:
  # Base de Datos PostgreSQL — red interna, sin puerto expuesto al host
  postgres:
    image: postgres:16-alpine
    container_name: pathseek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Solo visible dentro de la red interna Docker
    expose:
      - "5432"
    networks:
      - pathseek-internal

  # Backend Spring Boot Java 17 — red interna, sin puerto expuesto al host
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pathseek-backend:latest
    container_name: pathseek-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_EXPIRATION_MINUTES=${JWT_ACCESS_EXPIRATION_MINUTES:-15}
      - JWT_REFRESH_EXPIRATION_DAYS=${JWT_REFRESH_EXPIRATION_DAYS:-7}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - APP_BOOTSTRAP_USER_ENABLED=${APP_BOOTSTRAP_USER_ENABLED:-false}
      - APP_BOOTSTRAP_USER_NAME=${APP_BOOTSTRAP_USER_NAME:-}
      - APP_BOOTSTRAP_USER_EMAIL=${APP_BOOTSTRAP_USER_EMAIL:-}
      - APP_BOOTSTRAP_USER_PASSWORD=${APP_BOOTSTRAP_USER_PASSWORD:-}
      - APP_BOOTSTRAP_USER_ROLE=${APP_BOOTSTRAP_USER_ROLE:-ADMIN}
    # Solo visible dentro de la red interna Docker
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - pathseek-internal

  # Frontend Flutter Web (Nginx) — único punto de entrada al exterior
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: pathseek-frontend:latest
    container_name: pathseek-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"     # Cloudflare conecta aquí → Nginx sirve SPA y hace proxy /api/
    networks:
      - pathseek-internal

volumes:
  postgres_data:
    name: pathseek-postgres-data

networks:
  pathseek-internal:
    name: pathseek-network
    driver: bridge
