spring:
  application:
    name: pathseek-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pathseek}
    username: ${DB_USER:pathseek}
    password: ${DB_PASSWORD:pathseek_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt-secret: ${JWT_SECRET}
    access-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
    session-inactivity-minutes: ${SESSION_INACTIVITY_MINUTES:30}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  bootstrap-user:
    enabled: ${APP_BOOTSTRAP_USER_ENABLED:false}
    name: ${APP_BOOTSTRAP_USER_NAME:}
    email: ${APP_BOOTSTRAP_USER_EMAIL:}
    password: ${APP_BOOTSTRAP_USER_PASSWORD:}
    role: ${APP_BOOTSTRAP_USER_ROLE:ADMIN}

