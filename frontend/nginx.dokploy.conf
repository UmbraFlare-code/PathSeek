server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript application/wasm;

    # Resolver DNS interno de Docker (evita caídas si backend aún está iniciando)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Reverse Proxy to Spring Boot Backend API
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Preserva 'https' si la peticion vino cifrada desde Cloudflare o proxy SSL
        set $forwarded_proto $scheme;
        if ($http_x_forwarded_proto != "") {
            set $forwarded_proto $http_x_forwarded_proto;
        }
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # Optional APK Download Endpoint
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        add_header Content-Disposition "attachment; filename=pathseek.apk";
        add_header Content-Type "application/vnd.android.package-archive";
    }

    # SPA Routing (Flutter Web Fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
