version: '3.8'

services:
  # Base de Datos PostgreSQL con autoinicialización DDL y Seed Data
  postgres:
    image: postgres:16-alpine
    container_name: pathseek-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-pathseek}
      POSTGRES_USER: ${DB_USER:-pathseek}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pathseek_local}
    expose:
      - "5432"
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_schema_tablas.sql:/docker-entrypoint-initdb.d/01_schema_tablas.sql:ro
      - ./database/02_triggers.sql:/docker-entrypoint-initdb.d/02_triggers.sql:ro
      - ./database/03_stored_procedures.sql:/docker-entrypoint-initdb.d/03_stored_procedures.sql:ro
      - ./database/04_seed_data.sql:/docker-entrypoint-initdb.d/04_seed_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pathseek} -d ${DB_NAME:-pathseek}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot Java 17 API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pathseek-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-pathseek}
      - DB_USER=${DB_USER:-pathseek}
      - DB_PASSWORD=${DB_PASSWORD:-pathseek_local}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend Flutter Web (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pathseek-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:

networks:
  default:
    name: pathseek-network
