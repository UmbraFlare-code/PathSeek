name: Green IT & Performance Audit

on:
  push:
    paths: ['docs/**', 'frontend/**', '.github/workflows/green-audit.yml']
  pull_request:
    paths: ['docs/**', 'frontend/**', '.github/workflows/green-audit.yml']
  workflow_dispatch:

jobs:
  audit:
    name: Lighthouse CI Performance & Green Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true

      - name: Build the Flutter Web login
        working-directory: frontend
        run: |
          flutter pub get
          flutter build web --release --no-tree-shake-icons --no-web-resources-cdn

      - name: Audit the compiled login with Lighthouse
        run: npx --yes @lhci/cli@0.15.1 collect --staticDistDir=frontend/build/web --numberOfRuns=3

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-login
          path: .lighthouseci/
          include-hidden-files: true
